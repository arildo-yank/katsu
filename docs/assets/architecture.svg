<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="638" viewBox="0 0 1200 638" role="img" aria-labelledby="title desc">
  <title id="title">Katsu architecture and implementation status</title>
  <desc id="desc">Rust examples use the implemented katsu-core: Tensor, autograd and CPU kernels. Python is a version scaffold and HTTP is planned. Graph and activation inspection are available; Grad-CAM is not yet implemented.</desc>
  <defs>
    <marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62dfbb"/>
    </marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b62"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83b9ff"/>
    </marker>
  </defs>
  <rect width="1200" height="638" rx="20" fill="#0b1220"/>
  <text x="44" y="49" fill="#62dfbb" font-size="14" font-weight="700" font-family="Arial, Helvetica, sans-serif">01 / ARCHITECTURE</text>
  <text x="44" y="94" fill="#f0f5fc" font-size="34" font-weight="700" font-family="Arial, Helvetica, sans-serif">A small core. Explicit boundaries.</text>
  <text x="44" y="127" fill="#aabbd0" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Solid blocks are implemented. Dashed blocks are scaffolds or planned work.</text>
  <rect x="44" y="177" width="292" height="114" rx="16" fill="#121e30" stroke="#2a3b51" stroke-width="1.5"/>
  <text x="65" y="211" fill="#f0f5fc" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Rust application</text>
  <text x="65" y="245" fill="#aabbd0" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Tensor + Conv2D examples</text>
  <text x="65" y="270" fill="#62dfbb" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">Available today</text>
  <rect x="44" y="331" width="292" height="114" rx="16" fill="#121e30" stroke="#83b9ff" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="65" y="365" fill="#f0f5fc" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Python / PyO3</text>
  <text x="65" y="399" fill="#aabbd0" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Version module only</text>
  <text x="65" y="424" fill="#83b9ff" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">Tensor bindings pending</text>
  <rect x="44" y="485" width="292" height="114" rx="16" fill="#121e30" stroke="#83b9ff" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="65" y="519" fill="#f0f5fc" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">HTTP inference</text>
  <text x="65" y="553" fill="#aabbd0" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">Future service boundary</text>
  <text x="65" y="578" fill="#83b9ff" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">Not implemented</text>
  <path d="M 336 234 H 400" fill="none" stroke="#62dfbb" stroke-width="2.5" marker-end="url(#mint)"/>
  <path d="M 336 388 H 400" fill="none" stroke="#83b9ff" stroke-width="2.5" marker-end="url(#blue)" stroke-dasharray="7 6"/>
  <path d="M 336 542 H 400" fill="none" stroke="#83b9ff" stroke-width="2.5" marker-end="url(#blue)" stroke-dasharray="7 6"/>
  <rect x="400" y="177" width="420" height="422" rx="16" fill="#121e30" stroke="#62dfbb" stroke-width="1.5"/>
  <text x="426" y="215" fill="#62dfbb" font-size="27" font-weight="700" font-family="Arial, Helvetica, sans-serif">katsu-core</text>
  <text x="426" y="245" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">No external crate dependencies</text>
  <rect x="424" y="267" width="372" height="78" rx="16" fill="#19283c" stroke="#2a3b51" stroke-width="1.5"/>
  <text x="443" y="297" fill="#f0f5fc" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">Tensor</text>
  <text x="443" y="324" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Contiguous f32 data + shape</text>
  <rect x="424" y="365" width="372" height="78" rx="16" fill="#19283c" stroke="#2a3b51" stroke-width="1.5"/>
  <text x="443" y="395" fill="#f0f5fc" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">Autograd</text>
  <text x="443" y="422" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Parents + Op + optional gradient</text>
  <rect x="424" y="463" width="372" height="78" rx="16" fill="#19283c" stroke="#2a3b51" stroke-width="1.5"/>
  <text x="443" y="493" fill="#f0f5fc" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">CPU kernels</text>
  <text x="443" y="520" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">add / mul / matmul / sum / conv2d</text>
  <text x="426" y="578" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Rc ownership · RefCell gradients</text>
  <path d="M 820 388 H 869" fill="none" stroke="#62dfbb" stroke-width="2.5" marker-end="url(#mint)"/>
  <rect x="870" y="258" width="286" height="250" rx="16" fill="#121e30" stroke="#2a3b51" stroke-width="1.5"/>
  <text x="891" y="294" fill="#f0f5fc" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">Inspect the graph</text>
  <text x="891" y="337" fill="#62dfbb" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">op() / parents()</text>
  <text x="891" y="371" fill="#62dfbb" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">data() / grad()</text>
  <text x="891" y="412" fill="#aabbd0" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Activation access is ready.</text>
  <text x="891" y="446" fill="#83b9ff" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Grad-CAM heatmaps</text>
  <text x="891" y="472" fill="#83b9ff" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">are still planned.</text>
</svg>
