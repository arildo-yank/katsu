name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p katsu-core
      - run: cargo clippy -p katsu-core --all-targets -- -D warnings
      - run: cargo run -p katsu-core --release --example conv2d
