name: Rust core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p katu-core --locked
      - run: cargo clippy -p katu-core --all-targets -- -D warnings
      - run: cargo test -p katu-math --locked
      - run: cargo clippy -p katu-math --all-targets -- -D warnings
      # As rotas /math e /v1/compute: o contrato de integração que o Arandu usa e o novo.
      - run: cargo test -p katu-server --locked math::
      - run: cargo test -p katu-server --locked compute::
      - run: cargo run -p katu-core --release --example conv2d
      - run: cargo run -p katu-core --example train
      - run: cargo check -p katu-python --locked
      - run: python3 scripts/soberania/sbom.py --check
