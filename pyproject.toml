[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "katu"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Katu: typed N-d arrays, a blocked GEMM and symbolic calculus, computed in Rust"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arildo Yank" }]
keywords = ["arrays", "gemm", "calculus", "deep-learning", "rust"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Repository = "https://github.com/arildo-yank/katsu"

[tool.maturin]
manifest-path = "crates/katu-python/Cargo.toml"
python-source = "python"
module-name = "katu._native"
