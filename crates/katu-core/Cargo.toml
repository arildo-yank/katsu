[package]
name = "katu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CPU tensor foundation for Katu"

[dependencies]
rayon = "1.10"
cudarc = { version = "=0.19.9", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }

[features]
default = []
cuda = ["dep:cudarc"]
